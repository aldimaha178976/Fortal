/* ===== 21. JAM DIGITAL & NOTIFIKASI ADZAN ===== */
var _jamTimer = null, _adzanTimer = null;
var _adzanHari = '', _adzanTerpicu = {};
function initJamAzan(){
  if (_jamTimer){ clearInterval(_jamTimer); _jamTimer = null; }
  if (_adzanTimer){ clearInterval(_adzanTimer); _adzanTimer = null; }
  var app = $('#app');
  if (!app || !app.querySelector('#jam-tx')) return;
  tickJam();
  _jamTimer = setInterval(tickJam, 1000);
  _adzanTimer = setInterval(cekAdzan, 15000);
  cekAdzan();
}
function tickJam(){
  var el = document.getElementById('jam-tx');
  if (!el) return;
  var n = new Date();
  el.innerHTML =
    '<div class="jam">' + pad2(n.getHours()) + ':' + pad2(n.getMinutes()) +
    '<span class="detik">:' + pad2(n.getSeconds()) + '</span></div>' +
    '<div class="tgl">' + HARI[n.getDay()] + ', ' + n.getDate() + ' ' + BLN[n.getMonth()] + ' ' + n.getFullYear() + ' WIB</div>';
  var cd = document.getElementById('cd-tx');
  if (cd){
    var m = hitungMundur();
    cd.textContent = 'Berikutnya • ' + (m || '—');
  }
}
function cekAdzan(){
  var n = new Date();
  var kunciHari = n.toDateString();
  if (_adzanHari !== kunciHari){ _adzanHari = kunciHari; _adzanTerpicu = {}; }
  var j = jadwalTampil();
  ['Subuh','Dzuhur','Ashar','Maghrib','Isya'].forEach(function(nama){
    if (_adzanTerpicu[nama]) return;
    var p = String(j[nama] || '').split(':');
    if (p.length !== 2) return;
    var menitJadwal = (+p[0]) * 60 + (+p[1]);
    var menitKini   = n.getHours() * 60 + n.getMinutes();
    if (menitKini === menitJadwal){
      _adzanTerpicu[nama] = true;
      toast('🕌 Masuk waktu ' + nama.toUpperCase() + ' — ayo shalat!');
      mainkanAdzan();
    }
  });
}
function mainkanAdzan(){
  if (typeof musikHold === 'function') musikHold();
  var src = st().adzanAudio;
  if (src && String(src).indexOf('data:audio') === 0){
    try {
      var a = new Audio(src);
      a.volume = 1;
      a.play().catch(function(){
        playChime();
        toast('Klik halaman sekali (mis. tombol apa pun) agar browser mengizinkan suara adzan.', 'err');
      });
      return;
    } catch(e){}
  }
  playChime();
}
function playChime(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    playChime._ctx = playChime._ctx || new AC();
    var ctx = playChime._ctx;
    if (ctx.state === 'suspended') ctx.resume();
    [[659.25, 0], [880, .35], [659.25, .8], [1046.5, 1.2]].forEach(function(nt){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = nt[0];
      o.connect(g); g.connect(ctx.destination);
      var t = ctx.currentTime + nt[1];
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.35, t + .05);
      g.gain.exponentialRampToValueAtTime(.001, t + .9);
      o.start(t); o.stop(t + 1);
    });
  } catch(e){}
}
document.addEventListener('click', function(){
  try { if (playChime._ctx && playChime._ctx.state === 'suspended') playChime._ctx.resume(); } catch(e){}
});

/* ===== 22. ANIMASI JS ===== */
var REVEAL_SEL = '.card,.panel,.stat-strip,.prog-row,.prog-block,.artikel,.gal-item,.fas-item,' +
  '.vid-card,.tl-item,.info-line,.ann-item,.misi-list li,.adm-stat,.tbl-wrap';
var _rvIO = ('IntersectionObserver' in window)
  ? new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (!en.isIntersecting) return;
        var el = en.target;
        _rvIO.unobserve(el);
        el.classList.remove('pre'); el.classList.add('in');
        var d = parseFloat(el.style.getPropertyValue('--d') || 0);
        setTimeout(function(){
          el.classList.remove('rv','pre','in');
          el.style.removeProperty('--d');
        }, 950 + d);
      });
    }, { threshold:.12, rootMargin:'0px 0px -40px 0px' })
  : null;
function runTextHTML(){
  var items = [
    '<span class="arab">طَلَبُ الْعِلْمِ فَرِيْضَةٌ عَلَى كُلِّ مُسْلِمٍ</span> — HR. Ibnu Majah',
    '"Barangsiapa menempuh jalan mencari ilmu, Allah memudahkan baginya jalan ke surga." <b>— HR. Muslim</b>',
    '"Sebaik-baik kalian adalah yang belajar Al-Qur\u2019an dan mengajarkannya." <b>— HR. Bukhari</b>',
    '<span class="arab">مَنْ جَدَّ وَجَدَ</span> — Siapa bersungguh-sungguh, pasti berhasil',
    'Pendaftaran <b>PSB Online</b> telah dibuka — daftar melalui menu PSB Online',
    'Ilmu tanpa adab bagaikan pohon tanpa buah'
  ];
  var track = items.concat(items).map(function(t){
    return '<span class="rt-item">' + ic('mosque',14) + '<span>' + t + '</span></span>';
  }).join('');
  return '<div class="rt-track">' + track + '</div>';
}
function animateInit(){
  var app = $('#app');
  if (!app) return;
  app.classList.remove('page-in');
  void app.offsetWidth;
  app.classList.add('page-in');
  var rt = document.getElementById('runtext');
  var hasNav = !!document.querySelector('.nav');
  if (!rt && hasNav){
    rt = document.createElement('div');
    rt.id = 'runtext';
    rt.innerHTML = runTextHTML();
    document.querySelector('.nav').parentNode.insertBefore(rt, document.querySelector('.nav').nextSibling);
  }
  if (rt) rt.style.display = hasNav ? '' : 'none';
  var i = 0;
  app.querySelectorAll(REVEAL_SEL).forEach(function(el){
    if (el.classList.contains('rv')) return;
    el.style.setProperty('--d', ((i++ % 9) * 60) + 'ms');
    if (_rvIO){ el.classList.add('rv','pre'); _rvIO.observe(el); }
  });
}

/* ===== 23. ROUTER & BOOT ===== */
var lastRoute = null;
function render(){
  try {
    var h = location.hash || '#/beranda';
    var changed = h !== lastRoute;
    lastRoute = h;
    if (changed) window.scrollTo(0, 0);
    var parts = h.replace(/^#\/?/, '').split('/').filter(Boolean);
    var html, hook = null;

    if (parts[0] === 'santri'){
      var sessS = getSess();
      if (!sessS || !isKelPendamping(sessS.role)){ location.hash = '#/login'; return; }
      html = pagePortalSantri();
    }
    else if (parts[0] === 'admin' || parts[0] === 'login'){
      var sess = getSess();
      if (parts[0] === 'login' || !sess){ html = pageLogin(); }
      else if (isKelPendamping(sess.role)){ location.hash = '#/santri'; return; }
      else {
        var page = parts[1] || 'dashboard';
        var allowed = null;
        for (var i = 0; i < MENU.length; i++){
          if (MENU[i][0] === page && MENU[i][3].indexOf(sess.role) !== -1) allowed = MENU[i];
        }
        if (!allowed){
          html = adminLayout('dashboard', '<div class="panel">' + emptyState('Halaman tidak ditemukan atau bukan untuk level akses Anda.') + '</div>');
        } else {
          html = {
            dashboard:pageDashboard, psb:pageAdminPSB, ujian:pageAdminUjian, berita:pageAdminBerita, agenda:pageAdminAgenda,
            galeri:pageAdminGaleri, santri:pageAdminSantri, kelas:pageAdminKelas, mapel:pageAdminMapel,
            guru:pageAdminGuru, nilai:pageAdminNilai, absensi:pageAdminAbsensi, keuangan:pageAdminKeuangan,
            pengguna:pageAdminPengguna, pesan:pageAdminPesan, pengaturan:pageAdminPengaturan
          }[page]();
        }
      }
    }
    else {
      var pub = parts[0] || 'beranda';
      if (pub === 'berita' && parts[1]) html = pageBeritaDetail(parts[1]);
      else {
        var pages = { beranda:pageBeranda, profil:pageProfil, program:pageProgram, psb:pagePSB,
          berita:pageBeritaList, agenda:pageAgenda, galeri:pageGaleri, kontak:pageKontak };
        html = (pages[pub] || pageBeranda)();
        if (pub === 'beranda' || !pages[pub]) hook = counterInit;
      }
    }

    $('#app').innerHTML = html;
    animateInit();
    initJamAzan();
    heroSlideInit();
    musSync();
    if (hook) hook();
  } catch(err){
    console.error(err);
    $('#app').innerHTML =
      '<div style="max-width:620px;margin:60px auto;padding:28px;border:2px solid #B3402E;border-radius:14px;text-align:center;font-family:sans-serif">' +
      '<h2 style="color:#B3402E;margin-bottom:8px">Ada kesalahan teknis</h2>' +
      '<p style="color:#555;margin-bottom:14px">' + esc(String((err && err.message) || err)) + '</p>' +
      '<button onclick="location.reload()" style="padding:10px 22px;border:none;border-radius:9px;background:#11402F;color:#fff;cursor:pointer">Muat Ulang Halaman</button></div>';
  }
}
window.addEventListener('hashchange', render);
window.addEventListener('error', function(e){
  try {
    var b = document.getElementById('err-banner');
    if (!b){
      b = document.createElement('div');
      b.id = 'err-banner';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#B3402E;color:#fff;padding:9px 16px;font:13px/1.5 monospace;text-align:center';
      document.body.appendChild(b);
    }
    b.textContent = 'Kesalahan skrip: ' + e.message + ' — coba muat ulang (Ctrl+F5).';
  } catch(_e){}
});
function fatal(err){
  console.error(err);
  document.getElementById('app').innerHTML =
    '<div style="max-width:620px;margin:60px auto;padding:28px;border:2px solid #B3402E;border-radius:14px;text-align:center;font-family:sans-serif">' +
    '<h2 style="color:#B3402E;margin-bottom:8px">Gagal memuat portal</h2>' +
    '<p style="color:#555">' + esc(String((err && err.message) || err)) + '</p></div>';
}
function boot(){
  try {
    applyTheme(loadTheme());
    if (Store.load()) render();
    else Store.seed().then(render).catch(fatal);
  } catch(e){ fatal(e); }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
